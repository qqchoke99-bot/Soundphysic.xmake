name: Build SoundPhysicsBedrock

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Android SDK/NDK
        uses: android-actions/setup-android@v3

      - name: Install CMake
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.2.12479018"

      - name: Configure
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
        run: |
          cmake -S . -B build             -G Ninja             -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake"             -DANDROID_ABI=arm64-v8a             -DANDROID_PLATFORM=android-28             -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Package levipack
        run: |
          mkdir -p dist/SoundPhysicsBedrock/config
          cp build/libsound_physics_bedrock.so dist/SoundPhysicsBedrock/
          cp manifest.json dist/SoundPhysicsBedrock/
          cp config/config.json dist/SoundPhysicsBedrock/config/
          cp config/config.schema.json dist/SoundPhysicsBedrock/config/
          cd dist
          tar -cf SoundPhysicsBedrock.levipack SoundPhysicsBedrock

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SoundPhysicsBedrock-arm64-v8a
          path: dist/SoundPhysicsBedrock.levipack
